<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Your Cart - ECO-PACK</title>
    <link rel="stylesheet" href="./CSS/style.css" />
    <link rel="stylesheet" href="./CSS/cart.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
        <link rel="shortcut icon" href="./Images/logo.jpg" type="image/x-icon">


    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <!-- NAVBAR START -->
    <nav class="navbar">
      <div class="navbar-container">
        <!-- Logo -->
        <div class="navbar-logo">
          <a href="index.html">
            <img src="./Images/logo.jpg" alt="Eco-Pack Logo" />
          </a>
        </div>

        <!-- Nav Links (Center) & Mobile Menu Wrapper -->
        <div class="nav-menu-wrapper" id="navMenuWrapper">
          <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="service.html">Services</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </div>

        <!-- Right Side: Shopping Cart -->
        <div class="navbar-right-actions">
          <a href="cart.html" class="cart-icon-btn" aria-label="Shopping Cart">
            <i
              class="fa-solid fa-cart-shopping"
              style="color: rgb(233, 237, 240)"
            ></i>
            <span class="cart-badge">0</span>
          </a>
        </div>
      </div>
    </nav>
    <!-- NAVBAR END -->

    <!-- MAIN CART CONTENT -->
    <main style="padding: 40px; max-width: 800px; margin: 0 auto">
      <h1>Your Packaging Requests</h1>

      <!-- Container for dynamic cart items -->
      <div id="cart-items-container" style="margin-top: 20px">
        <p>Loading cart items...</p>
      </div>

      <!-- Clear Cart Button -->
      <button
        id="clear-cart"
        style="
          margin-top: 20px;
          padding: 10px 20px;
          background-color: #d9534f;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
        "
      >
        Clear Cart
      </button>
    </main>
  <script src="./JS/shop.js"></script>
    <!-- CART SCRIPT -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const container = document.getElementById("cart-items-container");
        const cart = JSON.parse(localStorage.getItem("ecoPackCart")) || [];

        // Update badge on loa                                                                                            d
        const badge = document.querySelector(".cart-badge");
        if (badge) {
          badge.textContent = cart.length;
        }

        if (cart.length === 0) {
          container.innerHTML = "<p>Your cart is empty.</p>";
          return;
        }

        let html = "<ul style='list-style: none; padding: 0;'>";
        cart.forEach((item, index) => {
          html += `
            <li style="background: #f9f9f9; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px;">
                <strong>Request #${index + 1}: ${item.product}</strong><br>
                Full Name: ${item.fullName}<br>
                Business: ${item.businessName}<br>
                Quantity: ${item.quantity}<br>
                Preferred Date: ${item.preferredDate}<br>
                Requirements: ${item.requirements}
            </li>
          `;
        });
        html += "</ul>";
        container.innerHTML = html;

        // Clear cart functionality
        const clearBtn = document.getElementById("clear-cart");
        if (clearBtn) {
          clearBtn.addEventListener("click", function () {
            localStorage.removeItem("ecoPackCart");
            location.reload();
          });
        }
      });
    </script>
  
  </body>
</html>
